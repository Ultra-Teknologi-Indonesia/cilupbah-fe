name: CI/CD Pipeline (FE Production)
on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: fe-production-deployment
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build (compile-time check)
        run: npm run build
        env:
          # Dummy value just so the build passes CI; the real value is baked on
          # the VPS at deploy time from docker-compose.production.yml.
          NEXT_PUBLIC_API_URL: https://ci-placeholder.invalid

  deploy:
    name: Deploy to Production VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.FE_PROD_DEPLOY_SERVER }}
          username: ${{ secrets.FE_PROD_DEPLOY_USER }}
          key: ${{ secrets.FE_PROD_SSH_PRIVATE_KEY }}
          timeout: 60m
          command_timeout: 60m
          script: |
            set -e
            cd ${{ secrets.FE_PROD_DEPLOY_PATH }}

            # ── Save current commit before pulling ────────────────────────────
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            echo "Previous commit: $PREVIOUS_COMMIT"

            # ── Pull latest code (volume-mounted) ─────────────────────────────
            git fetch origin production
            git reset --hard origin/production

            CURRENT_COMMIT=$(git rev-parse HEAD)
            echo "Current commit: $CURRENT_COMMIT"

            # ── Detect what changed ───────────────────────────────────────────
            CHANGED_FILES=$(git diff --name-only "$PREVIOUS_COMMIT" "$CURRENT_COMMIT")
            HAS_DOCKER_CHANGE=$(echo "$CHANGED_FILES" | grep -cE 'Dockerfile|docker-compose|start\.production\.sh' || true)

            # ── Rollback handler ──────────────────────────────────────────────
            rollback() {
              echo "⚠️  Deployment failed — rolling back to $PREVIOUS_COMMIT"
              git reset --hard "$PREVIOUS_COMMIT"
              docker compose -f docker-compose.production.yml restart web
              echo "✅ Rollback complete"
              exit 1
            }
            trap rollback ERR

            # ── Deploy ────────────────────────────────────────────────────────
            # Unlike the PHP backend, Next.js is NOT interpreted live — every code
            # change requires a fresh `npm run build`. The container entrypoint
            # (start.production.sh) runs `npm ci && npm run build && npm start` on
            # each boot, so a restart re-builds against the new source.
            if [ "$HAS_DOCKER_CHANGE" -gt 0 ]; then
              echo "Docker config changed — rebuilding image & container..."
              docker compose -f docker-compose.production.yml up -d --build --remove-orphans
            else
              echo "Code changed — restarting container to rebuild Next.js bundle..."
              docker compose -f docker-compose.production.yml restart web
            fi

            trap - ERR
            echo "✅ Deployment successful"
