name: Production Deploy

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pilih versi. 'latest' = deploy versi terbaru otomatis; vX.Y.Z = rollback ke versi itu."
        required: true
        type: choice
        default: latest
        options:
          - latest
          # BEGIN_VERSIONS (di-generate otomatis oleh CI staging tiap rilis — jangan edit manual)
          # END_VERSIONS

jobs:
  # ─────────────────────────────────────────────
  # Sanity check dulu SEBELUM nyentuh production:
  # - format versi harus vX.Y.Z (hindari typo)
  # - image dengan tag itu harus benar-benar ada di GHCR
  # ─────────────────────────────────────────────
  validate-input:
    name: Validate Version Input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout (untuk baca git tag saat resolve 'latest')
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve versi
        id: resolve
        run: |
          V="${{ inputs.version }}"
          if [ "$V" = "latest" ]; then
            V=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            if [ -z "$V" ]; then
              echo "Tak ada tag vX.Y.Z di repo."; exit 1
            fi
            echo "'latest' → $V"
          fi
          if [[ ! "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versi tidak valid: $V"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Login GHCR (read-only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cek image ada di GHCR
        run: |
          docker manifest inspect ghcr.io/ultra-teknologi-indonesia/cilupbah-frontend:${{ steps.resolve.outputs.version }} > /dev/null
          echo "Image ${{ steps.resolve.outputs.version }} ditemukan di GHCR, lanjut deploy."

  # ─────────────────────────────────────────────
  # Job ini pakai `environment: production`.
  # WAJIB dibuat dulu manual di:
  # Settings > Environments > New environment > "production"
  # -> centang "Required reviewers", tambahkan reviewer
  # Kalau environment ini belum dibuat, job akan tetap jalan
  # TANPA approval gate (jadi jangan lupa setup-nya).
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: validate-input
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH ke server production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.FE_PROD_DEPLOY_SERVER }}
          username: ${{ secrets.FE_PROD_DEPLOY_USER }}
          key: ${{ secrets.FE_PROD_SSH_PRIVATE_KEY }}
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e

            VERSION="${{ needs.validate-input.outputs.version }}"
            IMAGE="ghcr.io/ultra-teknologi-indonesia/cilupbah-frontend:${VERSION}"

            echo "Deploying $IMAGE ke production..."

            cd ${{ secrets.FE_PROD_DEPLOY_PATH }}

            # Pin docker-compose.production.yml ke tag versi yang diminta,
            # bukan cuma restart pakai apapun yang ke-pull sebelumnya.
            sed -i "s|^\( *image: \).*|\1${IMAGE}|" docker-compose.production.yml

            docker compose -f docker-compose.production.yml pull

            # Container lama dari pipeline sebelumnya (dibuat di luar compose
            # project ini) bisa bentrok nama dengan container yang mau dibuat
            # compose up di bawah — paksa hapus dulu biar aman.
            docker rm -f cilupbah-fe-production 2>/dev/null || true

            docker compose -f docker-compose.production.yml up -d --remove-orphans

            # Cleanup image lama — sisakan HANYA yang sedang jalan (KEEP=1).
            # Ditaruh SETELAH up -d sukses; `set -e` menghentikan script di atas
            # kalau deploy gagal, jadi image lama tetap utuh untuk rollback.
            # SCOPED ke repo ini saja (VPS bisa dipakai bersama app lain), jadi
            # hindari `prune -af` global. `docker rmi` gagal-aman untuk image yang
            # sedang dipakai container, jadi yang jalan selamat.
            # Rollback = jalankan ulang workflow ini dengan `version` lama
            # (image ditarik ulang dari GHCR).
            docker images "${IMAGE%:*}" --format '{{.Repository}}:{{.Tag}}' \
              | grep -v ':<none>$' | xargs -r -n1 docker rmi 2>/dev/null || true
            docker image prune -f

            echo "Production deployment success: $VERSION"
